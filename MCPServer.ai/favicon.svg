<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C3CE9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF3366;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4AA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6C3CE9;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#0D0D1A"/>
  <circle cx="32" cy="32" r="28" fill="url(#grad1)" opacity="0.2"/>

  <!-- Server icon - stylized -->
  <rect x="16" y="14" width="32" height="10" rx="2" fill="url(#grad1)"/>
  <rect x="16" y="27" width="32" height="10" rx="2" fill="url(#grad1)"/>
  <rect x="16" y="40" width="32" height="10" rx="2" fill="url(#grad1)"/>

  <!-- Connection dots -->
  <circle cx="22" cy="19" r="2" fill="#00D4AA"/>
  <circle cx="22" cy="32" r="2" fill="#00D4AA"/>
  <circle cx="22" cy="45" r="2" fill="#00D4AA"/>

  <!-- Status indicators -->
  <rect x="38" y="17" width="6" height="4" rx="1" fill="#00D4AA"/>
  <rect x="38" y="30" width="6" height="4" rx="1" fill="#FF3366"/>
  <rect x="38" y="43" width="6" height="4" rx="1" fill="#00D4AA"/>
</svg>
